name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: 检查与测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 路径分隔符、换行符与进程管理在两个平台上行为不同，两边都要跑。
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
